name: Manual Build & Deploy ProcureBuddy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Environment'
        required: true
        default: 'stg'
        type: choice
        options:
          - stg
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create Deployment Archive
        run: |
          zip -r deploy.zip src scripts databases prisma public package.json package-lock.json server.js next.config.ts tsconfig.json postcss.config.mjs eslint.config.mjs deploy-app.sh

      - name: Copy Archive to VM via SFTP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          source: "deploy.zip"
          target: "/home/${{ secrets.VM_USERNAME }}/"

      - name: Extract & Run Deploy Script on VM
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USERNAME }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: 22
          script: |
            # 1. Select destination folder based on environment choice
            TARGET_DIR="/var/www/procurebuddy-${{ github.event.inputs.target_env }}"
            
            # 2. Extract files (directory ownership pre-granted on VM)
            mkdir -p $TARGET_DIR
            unzip -o /home/${{ secrets.VM_USERNAME }}/deploy.zip -d $TARGET_DIR
            
            # 3. Clean up Windows carriage returns
            sed -i 's/\r$//' $TARGET_DIR/deploy-app.sh
            
            # 4. Trigger deployment script inside target folder
            cd $TARGET_DIR
            chmod +x deploy-app.sh
            ./deploy-app.sh ${{ github.event.inputs.target_env }}
